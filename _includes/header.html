<header class="site-header">
  <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <nav class="menu">
    <ul>
      {%- for path in site.header_pages -%}
        {%- assign my_page = site.pages | where: "path", path | first -%}
        {%- if my_page.title -%}
        <li><a href="{{ my_page.url | relative_url }}"{% if my_page.url == page.url %} class="active"{% endif %}>{{ my_page.permalink_name | remove: "/" | capitalize }}</a></li>
        {%- endif -%}
      {%- endfor -%}
    </ul>
  </nav>
</header>
